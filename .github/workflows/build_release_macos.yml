name: Build Calaos Installer MacOS release

# Called by publish.yml only: it uploads the signed, notarized dmg as an
# artifact, publish.yml tags and publishes it once the three platforms have built.
on:
    workflow_call:
        inputs:
            version:
                description: 'Release tag to build, e.g. v4.8.1 or v4.8.1-dev.0'
                required: true
                type: string
        secrets:
            MACOS_CERT_P12:
                required: true
            MACOS_CERT_PASS:
                required: true
            MACOS_KEYCHAIN_PASS:
                required: true
            MACOS_NOTARIZATION_USERNAME:
                required: true
            MACOS_NOTARIZATION_PASSWORD:
                required: true
            MACOS_NOTARIZATION_TEAMID:
                required: true

permissions:
    contents: read

jobs:
    compile:
        name: Build
        runs-on: macos-latest
        env:
            QT_VERSION: '6.12.0'
            RELEASE_VERSION: ${{ inputs.version }}
        steps:
          - name: Check out the repo
            uses: actions/checkout@v4
            with:
                ref: ${{ github.sha }}
                persist-credentials: false

          - name: Import certificate
            uses: apple-actions/import-codesign-certs@v3
            with:
              p12-file-base64: ${{ secrets.MACOS_CERT_P12 }}
              p12-password: ${{ secrets.MACOS_CERT_PASS }}
              keychain: "build"
              keychain-password: ${{ secrets.MACOS_KEYCHAIN_PASS }}

          - name: Install Qt ${{ env.QT_VERSION }} (macOS)
            uses: jurplel/install-qt-action@v4
            with:
                version: ${{ env.QT_VERSION }}
                host: 'mac'
                target: 'desktop'
                arch: 'clang_64'
                modules: 'qt5compat qtserialport'
                cache: true

          - name: Install deps
            run: bash scripts/macos/install_deps.sh

          - name: Compile
            run: bash scripts/macos/build.sh

          - name: Package
            run: bash scripts/macos/package.sh

          - name: Notarize Release Build
            uses: lando/notarize-action@v2
            with:
              product-path: "${{ env.PACKAGE_FILE_NAME }}"
              appstore-connect-username: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
              appstore-connect-password: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
              appstore-connect-team-id: ${{ secrets.MACOS_NOTARIZATION_TEAMID }}
              tool: "notarytool"
              verbose: true

          - name: Submit the dmg to notarization
            run: bash scripts/macos/notarize.sh
            env:
              MACOS_NOTARIZATION_USERNAME: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
              MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
              MACOS_NOTARIZATION_TEAMID: ${{ secrets.MACOS_NOTARIZATION_TEAMID }}

          - name: Upload the dmg
            uses: actions/upload-artifact@v4
            with:
                name: release-macos
                path: build/calaos_installer-${{ inputs.version }}.dmg
                if-no-files-found: error
                retention-days: 7
