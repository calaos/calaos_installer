name: Build Calaos Installer Windows release

on: workflow_dispatch

jobs:
    compile:
        name: Build
        runs-on: windows-latest
        env:
            QT_VERSION: '6.12.0'
        steps:
          - name: Check out the repo
            uses: actions/checkout@v4
            with:
                fetch-depth: 0

          - name: Install Qt ${{ env.QT_VERSION }} (MinGW 64-bit)
            uses: jurplel/install-qt-action@v4
            with:
                version: ${{ env.QT_VERSION }}
                host: 'windows'
                target: 'desktop'
                arch: 'win64_mingw'
                modules: 'qt5compat qtserialport'
                tools: 'tools_mingw1310'
                # aqtinstall 3.3.0 cannot read the per-toolchain repository layout of
                # Qt 6.12 on Windows ("Failed to locate XML data"); its master can.
                # TODO: back to a PyPI release (drop aqtsource) once aqtinstall PR #1048 ships.
                aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
                cache: true

          - name: Add MinGW to PATH
            shell: pwsh
            run: |
                # install-qt-action installs tools under IQTA_TOOLS
                # Prefer 64-bit MinGW (mingw*_64) over generic entries
                $mingwDir = Get-ChildItem -Path "$env:IQTA_TOOLS" -Filter "mingw*_64" -Directory | Select-Object -First 1
                if (-not $mingwDir) {
                    $mingwDir = Get-ChildItem -Path "$env:IQTA_TOOLS" -Filter "mingw*" -Directory | Select-Object -First 1
                }
                if ($mingwDir) {
                    $binDir = Join-Path $mingwDir.FullName "bin"
                    Write-Host "Adding MinGW to PATH: $binDir"
                    echo "$binDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                } else {
                    Write-Error "MinGW toolchain not found under $env:IQTA_TOOLS"
                    exit 1
                }

          - name: Install MSYS2 dependencies
            shell: cmd
            run: |
                C:\msys64\usr\bin\pacman -S --noconfirm --needed mingw-w64-x86_64-zlib mingw-w64-x86_64-bzip2 mingw-w64-x86_64-xz mingw-w64-x86_64-openssl mingw-w64-x86_64-zstd mingw-w64-x86_64-pkg-config

          - name: Cache KArchive build
            uses: actions/cache@v4
            id: karchive-cache
            with:
                path: C:/karchive
                # Built against Qt's headers: a Qt update rebuilds it.
                key: karchive-kf6-mingw64-qt${{ env.QT_VERSION }}-${{ hashFiles('win32/scripts/build_karchive.ps1') }}

          - name: Build KArchive from source
            if: steps.karchive-cache.outputs.cache-hit != 'true'
            shell: pwsh
            run: ./win32/scripts/build_karchive.ps1

          - name: Compile
            shell: pwsh
            run: ./win32/scripts/build_installer.ps1

          - name: Package
            shell: pwsh
            run: ./win32/scripts/package_installer.ps1

          - name: Deploy
            shell: pwsh
            run: ./win32/scripts/deploy_installer.ps1 -UploadToken "${{ secrets.UPLOAD_TOKEN }}" -RelType "stable"
