name: PR CI

# Release builds (ci_build.yml) only run on push and take 10-14 minutes on three
# platforms. A pull request gets one Linux job that compiles the app and runs
# the unit tests.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit tests (Qt 6 / qmake)
    runs-on: ubuntu-latest
    # Arch ships Qt 6 and KArchive (KF6) built against each other. Ubuntu's
    # Qt 6.4 predates the KF6 packages, and a Qt from aqt cannot link against
    # a distro libKF6Archive.
    # Dated tag: the bare date tag does not exist, only date.0.build. The
    # pacman -Syu below still moves Qt; the pin only freezes the base image.
    container: archlinux:base-devel-20261004.0.606936
    steps:
      # Before actions/checkout so that it can use git instead of the REST API.
      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm --needed \
            git \
            karchive \
            qt6-base \
            qt6-5compat \
            qt6-declarative \
            qt6-mqtt \
            qt6-serialport \
            qt6-shadertools \
            qt6-tools \
            libglvnd \
            gtk3 \
            xorg-server-xvfb \
            xorg-xauth

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The checkout is owned by another uid inside the container; qmake runs
      # `git describe` for the version string.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Show toolchain versions
        run: |
          qmake6 -v
          g++ --version | head -n 1

      - name: Build the application
        run: |
          mkdir -p build-app
          cd build-app
          qmake6 ../calaos_installer.pro
          make -j$(nproc)

      - name: Build the unit tests
        run: |
          mkdir -p build-tests
          cd build-tests
          qmake6 ../tests/tests.pro
          make -j$(nproc)

      - name: Run the unit tests
        env:
          QT_QPA_PLATFORM: offscreen
          # tst_apptheme starts from a dark GTK platform theme, which needs an X display
          # (the widgets still render offscreen); fail rather than skip without it.
          CALAOS_REQUIRE_DARK_SYSTEM: "1"
          # The broker discovery of the device wizard is built with Qt MQTT only: its tests must run here.
          CALAOS_REQUIRE_MQTT: "1"
        run: xvfb-run -a make -C build-tests check

  # data/doc is generated by calaos_base (its CI publishes the io-doc artifact).
  # Reading the artifact beats building the server here: this job takes seconds,
  # needs no second toolchain (the server builds on Debian, this repo's jobs run
  # on Arch), and compares with what the server's own CI tested.
  # On a pull request, a branch of calaos_base with the same name is used when
  # there is one, so that a change made in both repositories can be green
  # before calaos_base is merged.
  iodoc-sync:
    name: IO documentation is the server's
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-test of the download and of the comparison
        run: |
          python3 -I tests/iodoc_sync/test_check_iodoc_sync.py
          python3 -I tests/iodoc_sync/test_fetch_iodoc_artifact.py
          python3 -I tests/server_load/test_check.py

      - name: Download the documentation generated by calaos_base
        env:
          GH_TOKEN: ${{ github.token }}
          CALAOS_BASE_BRANCH: ${{ github.head_ref }}
        run: scripts/fetch_iodoc_artifact.sh "$RUNNER_TEMP/server-doc"

      - name: Compare data/doc with it
        run: python3 scripts/check_iodoc_sync.py "$RUNNER_TEMP/server-doc"
