name: Build Calaos Installer Flatpak release

# Called by publish.yml only: it uploads the bundle as an artifact, publish.yml
# tags and publishes it once the three platforms have built.
on:
  workflow_call:
    inputs:
      version:
        description: 'Release tag to build, e.g. v4.8.1 or v4.8.1-dev.0'
        required: true
        type: string
      appstream_version:
        description: 'Same version in AppStream form, e.g. 4.8.1 or 4.8.1~dev.0'
        required: true
        type: string
      prerelease:
        description: 'Marks the AppStream release as a development one'
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  build-flatpak:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      APPSTREAM_VERSION: ${{ inputs.appstream_version }}
      PRERELEASE: ${{ inputs.prerelease }}
      FLATPAK_FILE: calaos_installer-${{ inputs.version }}.flatpak

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Generate version header
        run: |
          source scripts/funcs.sh
          make_version .
          echo "Building version: $RELEASE_VERSION"

      - name: Inject version into the Flatpak manifest and metainfo
        run: |
          # The flatpak build has no tags to describe: hand the version to the
          # first qmake module (calaos-installer) like the other platforms do.
          sed -i "0,/^      - PREFIX=\/app\$/s//&\n      - REVISION=${RELEASE_VERSION}/" \
            flatpak/fr.calaos.CalaosInstaller.yml
          grep -q -- "- REVISION=${RELEASE_VERSION}\$" flatpak/fr.calaos.CalaosInstaller.yml

          # AppStream sorts 4.8.1~dev.0 before 4.8.1; 4.8.1-dev.0 would sort after it.
          TYPE=""
          if [ "$PRERELEASE" = "true" ]; then
            TYPE=' type="development"'
          fi
          DATE="$(date +%Y-%m-%d)"
          sed -i "s|<release version=\"0.0.0\" date=\"2024-01-01\">|<release version=\"${APPSTREAM_VERSION}\" date=\"${DATE}\"${TYPE}>|" \
            flatpak/fr.calaos.CalaosInstaller.metainfo.xml
          sed -i "s|<p>Development build</p>|<p>Calaos Installer ${RELEASE_VERSION}</p>|" \
            flatpak/fr.calaos.CalaosInstaller.metainfo.xml
          grep -q "<release version=\"${APPSTREAM_VERSION}\"" flatpak/fr.calaos.CalaosInstaller.metainfo.xml
          echo "Metainfo updated with version $APPSTREAM_VERSION ($DATE)"

      - name: Install Flatpak and Flatpak Builder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder

      - name: Add Flathub remote
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install KDE SDK and Platform runtime
        run: |
          flatpak install --user -y --noninteractive flathub org.kde.Sdk//6.11 org.kde.Platform//6.11

      - name: Build Flatpak
        run: |
          flatpak-builder \
            --user \
            --force-clean \
            --default-branch=stable \
            --install-deps-from=flathub \
            --repo=flatpak-repo \
            flatpak-build \
            flatpak/fr.calaos.CalaosInstaller.yml

      - name: Create Flatpak bundle
        run: |
          flatpak build-bundle \
            flatpak-repo \
            "$FLATPAK_FILE" \
            fr.calaos.CalaosInstaller \
            stable

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-flatpak
          path: ${{ env.FLATPAK_FILE }}
          if-no-files-found: error
          retention-days: 7
