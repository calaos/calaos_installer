# Read by qmake for every project of this tree (application, tests, machine_creator).
#
# qmake does not make objects depend on Qt's headers, so after a Qt update an
# incremental build links stale objects with fresh ones. Qt 6.11 changed the layout
# of the inline QtPrivate array ops: the two copies of one template share a symbol,
# the linker keeps one, and callers built with the other layout crash.
# One directory per Qt version turns a Qt update into a full rebuild.
CALAOS_BUILD_DIR = build-qt$$[QT_VERSION]
OBJECTS_DIR = $$CALAOS_BUILD_DIR/obj
MOC_DIR = $$CALAOS_BUILD_DIR/moc
RCC_DIR = $$CALAOS_BUILD_DIR/rcc
UI_DIR = $$CALAOS_BUILD_DIR/ui

QMAKEFEATURES *= $$PWD/qmake
CONFIG += calaos_former_layout
